[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadne"
version = "1.1.0"
description = "Ariadne: an AI agent that navigates websites, understands a natural-language request, and retrieves the specific information with verifiable proof."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
render = ["playwright>=1.44"]
semantic = ["sentence-transformers>=2.7"]
dev = ["pytest>=8"]

[project.scripts]
ariadne = "ariadne.cli:main"

[tool.setuptools]
packages = ["ariadne"]
